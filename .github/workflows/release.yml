name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          out="shakedown_${GOOS}_${GOARCH}${ext}"
          go build -trimpath -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME}" \
            -o "$out" ./cmd/shakedown
          sha256sum "$out" > "$out.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: shakedown-${{ matrix.goos }}-${{ matrix.goarch }}
          path: shakedown_*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Build .deb packages
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver="${VERSION#v}"
          for arch in amd64 arm64; do
            bin="dist/shakedown_linux_${arch}"
            pkg="dist/shakedown_${ver}_${arch}.deb"
            rm -rf "deb-${arch}"
            mkdir -p "deb-${arch}/usr/bin" "deb-${arch}/DEBIAN"
            install -m 0755 "${bin}" "deb-${arch}/usr/bin/shakedown"
            cat > "deb-${arch}/DEBIAN/control" <<EOF
            Package: shakedown
            Version: ${ver}
            Section: utils
            Priority: optional
            Architecture: ${arch}
            Maintainer: mAmineChniti <amine@example.com>
            Description: Migration rehearsal for databases
             shakedown executes your migrations against a disposable database and
             reports locks, rewrites, data-safety exposure, and rollback drift.
            EOF
            dpkg-deb --build --root-owner-group "deb-${arch}" "${pkg}"
          done
      - name: Checksums
        run: cd dist && sha256sum shakedown_linux_* shakedown_*.deb > checksums.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
